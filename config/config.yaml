# reference_id identifies one parental cross; prefixes are parental names without the trailing underscore.
reference_id: ""

parents:
  parent1:
    prefix: ""
    fasta: ""
    gtf: ""
  parent2:
    prefix: ""
    fasta: ""
    gtf: ""

rna_gene_pairs: ""
moa_peak_pairs: ""

moa:
  # MOA preprocessing and mapping defaults follow Engelhorn et al. 2025;
  # adjust them as needed for other datasets.
  seqpurge:
    min_len: 20
    # qcut 0 intentionally disables quality trimming.
    qcut: 0
  ngmerge:
    mismatch_fraction: 0.2
    min_overlap: 15
    dovetail: true
    min_dovetail_overlap: 30
  star:
    align_intron_max: 1
    out_sam_mult_nmax: 2
    win_anchor_multimap_nmax: 100

# Portable per-job requirements. mem_mb is total memory for one job, and
# runtime is in minutes. Adjust these values for your data and environment.
# Scheduler queues, partitions, accounts, and submission settings belong in
# execution profiles, not in this section.
rule_resources:
  build_concatenated_reference:
    threads: 1
    mem_mb: 8000
    runtime: 120
  build_star_index:
    threads: 8
    mem_mb: 96000
    runtime: 720
  validate_rna_gene_pairs:
    threads: 1
    mem_mb: 2000
    runtime: 30
  validate_moa_peak_pairs:
    threads: 1
    mem_mb: 2000
    runtime: 30
  raw_fastqc:
    threads: 2
    mem_mb: 4000
    runtime: 120
  rna_fastp:
    threads: 4
    mem_mb: 8000
    runtime: 240
  moa_seqpurge:
    threads: 8
    mem_mb: 8000
    runtime: 240
  moa_ngmerge:
    threads: 4
    mem_mb: 8000
    runtime: 240
  moa_merged_fastqc:
    threads: 1
    mem_mb: 4000
    runtime: 120
  map_moa_star:
    threads: 8
    mem_mb: 64000
    runtime: 720
  count_moa_peaks:
    threads: 1
    mem_mb: 8000
    runtime: 120
  rna_clean_fastqc:
    threads: 2
    mem_mb: 4000
    runtime: 120
  map_rna_star:
    threads: 8
    mem_mb: 64000
    runtime: 720
  count_rna_genes:
    threads: 4
    mem_mb: 16000
    runtime: 360
  rna_multiqc:
    threads: 1
    mem_mb: 8000
    runtime: 120
  rna_gene_qc:
    threads: 1
    mem_mb: 8000
    runtime: 120

# Optional sample report; disabled by default.
rna_gene_qc:
  sample_report:
    enabled: false
    libraries:
      - all
    plot_types:
      - histogram
      - scatter

samples: "config/samples.tsv"
